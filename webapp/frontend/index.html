<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Parking — find a spot near you</title>

<!-- Leaflet (OpenStreetMap) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel-2:#16223c; --line:#22304f;
    --text:#e8eefc; --muted:#9fb0d0; --brand:#3b82f6; --brand-2:#2563eb;
    --low:#16a34a; --med:#d97706; --high:#dc2626;
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#16305e 0%,var(--bg) 55%);
    color:var(--text); display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:16px 22px;
    border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
  }
  .logo{font-size:26px} h1{font-size:19px;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .spacer{flex:1}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--line);
        padding:6px 10px;border-radius:999px;background:var(--panel)}

  .layout{flex:1;display:grid;grid-template-columns:1fr 380px;gap:0;min-height:0}
  #map{height:100%;min-height:420px;background:#0e1626}
  .sidebar{border-left:1px solid var(--line);display:flex;flex-direction:column;
           min-height:0;background:var(--panel)}
  .controls{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;
            flex-wrap:wrap;gap:10px;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  select,input,button{font:inherit;color:var(--text);background:var(--panel-2);
            border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
  select:focus,input:focus{border-color:var(--brand)}
  button{cursor:pointer}
  .btn-primary{background:var(--brand-2);border-color:var(--brand-2);font-weight:600}
  .btn-primary:hover{background:var(--brand)}
  .btn-ghost:hover{border-color:var(--brand)}

  .status{padding:12px 16px;font-size:13px;color:var(--muted)}
  .status.err{color:#fecaca;background:rgba(220,38,38,.12);border-bottom:1px solid var(--line)}
  .status .link{color:var(--brand);cursor:pointer;text-decoration:underline}

  .list{overflow:auto;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
  .card{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;
        padding:13px 14px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--brand);transform:translateY(-1px)}
  .card.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(59,130,246,.25)}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
  .card h3{margin:0;font-size:15px;font-weight:650;line-height:1.25}
  .card .dist{color:var(--muted);font-size:12px;white-space:nowrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;text-transform:uppercase;letter-spacing:.03em}
  .b-low{background:var(--low)} .b-med{background:var(--med)} .b-high{background:var(--high)}
  .free{display:flex;align-items:baseline;gap:6px;margin:9px 0 6px}
  .free .n{font-size:24px;font-weight:800} .free .lbl{font-size:12px;color:var(--muted)}
  .bar{height:7px;border-radius:6px;background:#0d1730;overflow:hidden}
  .bar>i{display:block;height:100%}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted)}
  .meta a{color:var(--brand);text-decoration:none}
  .est-tag{font-size:10px;color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:6px}

  .empty{padding:30px 16px;text-align:center;color:var(--muted)}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brand);
        border-radius:50%;display:inline-block;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .leaflet-popup-content{font:inherit}
  .pop h4{margin:0 0 4px;font-size:14px} .pop .pf{font-size:13px}

  @media (max-width:880px){
    .layout{grid-template-columns:1fr;grid-template-rows:46vh 1fr}
    .sidebar{border-left:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
  <header>
    <div class="logo">🅿️</div>
    <div>
      <h1>Smart Parking</h1>
      <div class="sub">Real lots near you · AI availability estimates</div>
    </div>
    <div class="spacer"></div>
    <div class="pill" id="forTime">—</div>
  </header>

  <div class="layout">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="controls">
        <div class="field">
          <label>Search radius</label>
          <select id="radius">
            <option value="800">800 m</option>
            <option value="1500" selected>1.5 km</option>
            <option value="3000">3 km</option>
            <option value="5000">5 km</option>
          </select>
        </div>
        <div class="field">
          <label>Time of day</label>
          <select id="hour"></select>
        </div>
        <div class="field">
          <label>Day</label>
          <select id="day"></select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn-primary" id="refresh">↻ Update</button>
        </div>
      </div>

      <div id="status" class="status"></div>
      <div id="list" class="list"></div>
    </aside>
  </div>

<script>
// Always use 127.0.0.1 (IPv4): "localhost" can resolve to IPv6 ::1, which the
// IPv4-bound uvicorn server doesn't answer -> "Failed to fetch".
const API = 'http://127.0.0.1:8000';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

let map, userMarker, lotLayer, markers = {}, current = null;

// ---- UI helpers ----
const $ = id => document.getElementById(id);
// OSM data (lot names, tags) is world-editable, so treat it as untrusted and
// escape it before it ever touches innerHTML — prevents stored XSS via lot names.
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function riskClass(r){ return r==='high'?'high':r==='medium'?'med':'low'; }
function riskColor(r){ return r==='high'?'#dc2626':r==='medium'?'#d97706':'#16a34a'; }
function setStatus(html, isErr){ const s=$('status'); s.className='status'+(isErr?' err':''); s.innerHTML=html; }

function fillTimeControls(){
  const now = new Date();
  const h = $('hour');
  for(let i=0;i<24;i++){
    const ampm = i===0?'12 AM':i<12?`${i} AM`:i===12?'12 PM':`${i-12} PM`;
    h.add(new Option(ampm, i, false, i===now.getHours()));
  }
  const d = $('day');
  const todayIdx = (now.getDay()+6)%7; // JS Sun=0 -> our Mon=0
  DAYS.forEach((name,i)=> d.add(new Option(name, i, false, i===todayIdx)));
}

function updateForTimePill(){
  $('forTime').textContent = `for ${$('hour').selectedOptions[0].text} · ${DAYS[+$('day').value]}`;
}

// ---- map ----
function initMap(lat, lng){
  map = L.map('map',{zoomControl:true}).setView([lat,lng],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap contributors'
  }).addTo(map);
  lotLayer = L.layerGroup().addTo(map);
  setUser(lat,lng);
}
function setUser(lat,lng){
  if(userMarker) userMarker.remove();
  userMarker = L.circleMarker([lat,lng],{
    radius:9,color:'#fff',weight:3,fillColor:'#3b82f6',fillOpacity:1
  }).addTo(map).bindPopup('<b>You are here</b>');
}

// ---- rendering ----
function dirLink(lat,lng){ return `https://www.openstreetmap.org/directions?to=${lat},${lng}`; }

function render(data){
  updateForTimePill();
  lotLayer.clearLayers(); markers={}; current=null;
  const list = $('list'); list.innerHTML='';
  const lots = data.lots || [];

  if(!lots.length){
    list.innerHTML = '<div class="empty">No parking found in this area.<br>Try a larger radius.</div>';
    setStatus(`No lots within ${(+$('radius').value/1000)} km.`);
    return;
  }
  setStatus(`Found <b>${lots.length}</b> parking lot${lots.length>1?'s':''} nearby. Tap one to locate it on the map.`);

  lots.forEach(lot=>{
    // marker
    const m = L.circleMarker([lot.lat,lot.lng],{
      radius:9,color:'#0b1220',weight:1.5,fillColor:riskColor(lot.riskLabel),fillOpacity:.95
    }).addTo(lotLayer);
    m.bindPopup(
      `<div class="pop"><h4>${esc(lot.name)}</h4>`+
      `<div class="pf"><b style="color:${riskColor(lot.riskLabel)}">${lot.predictedAvailable}</b> of ${lot.capacity} free (est.)</div>`+
      `<div class="pf">${lot.distanceKm} km away</div>`+
      `<a href="${dirLink(lot.lat,lot.lng)}" target="_blank">Directions →</a></div>`
    );
    m.on('click',()=>selectCard(lot.id));
    markers[lot.id]=m;

    // card
    const occ = lot.occupancyPercent;
    const card = document.createElement('div');
    card.className='card'; card.id='card-'+CSS.escape(lot.id);
    card.innerHTML =
      `<div class="top">
         <h3>${esc(lot.name)}</h3>
         <span class="dist">${lot.distanceKm} km</span>
       </div>
       <div class="free">
         <span class="n" style="color:${riskColor(lot.riskLabel)}">${lot.predictedAvailable}</span>
         <span class="lbl">/ ${lot.capacity} spots free</span>
         <span class="badge b-${riskClass(lot.riskLabel)}" style="margin-left:auto">${lot.riskLabel}</span>
       </div>
       <div class="bar"><i style="width:${occ}%;background:${riskColor(lot.riskLabel)}"></i></div>
       <div class="meta">
         <span>${occ}% full</span>
         <span>~${lot.confidencePercent}% confidence</span>
         ${lot.fee==='yes'?'<span>💰 paid</span>':lot.fee==='no'?'<span>🆓 free</span>':''}
         ${lot.capacityEstimated?'<span class="est-tag">capacity est.</span>':''}
         <a href="${dirLink(lot.lat,lot.lng)}" target="_blank">Directions →</a>
       </div>`;
    card.onclick = ()=>{ selectCard(lot.id); map.flyTo([lot.lat,lot.lng],17); markers[lot.id].openPopup(); };
    list.appendChild(card);
  });
}

function selectCard(id){
  if(current){ const p=$('card-'+CSS.escape(current)); if(p) p.classList.remove('active'); }
  current=id; const el=$('card-'+CSS.escape(id));
  if(el){ el.classList.add('active'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

// ---- data ----
let lastPos=null;
async function loadNearby(lat,lng){
  lastPos={lat,lng};
  setStatus('<span class="spin"></span>Finding real parking near you…');
  const params = new URLSearchParams({
    lat, lng, radius:$('radius').value, hour:$('hour').value, dayOfWeek:$('day').value
  });
  try{
    const res = await fetch(`${API}/api/nearby?${params}`);
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      throw new Error(e.detail || `server returned ${res.status}`);
    }
    render(await res.json());
  }catch(err){
    setStatus(`Couldn't load parking: ${err.message}.
      <span class="link" id="retry">Retry</span>`, true);
    const r=$('retry'); if(r) r.onclick=()=>loadNearby(lat,lng);
  }
}

// ---- geolocation + fallback ----
function locate(){
  setStatus('<span class="spin"></span>Requesting your location…');
  if(!navigator.geolocation){ return fallback('Geolocation not supported by this browser.'); }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const {latitude:lat, longitude:lng} = pos.coords;
      if(!map) initMap(lat,lng); else { map.setView([lat,lng],15); setUser(lat,lng); }
      loadNearby(lat,lng);
    },
    err=> fallback(err.code===1
      ? 'Location permission denied. Search a place instead:'
      : 'Could not get your location. Search a place instead:'),
    {enableHighAccuracy:true, timeout:10000, maximumAge:60000}
  );
}

function fallback(msg){
  if(!map){ initMap(20,0); map.setView([20,0],2); }
  setStatus(`${msg}
    <div style="margin-top:8px;display:flex;gap:8px">
      <input id="place" placeholder="e.g. Connaught Place, Delhi" style="flex:1"/>
      <button class="btn-ghost" id="go">Search</button>
    </div>
    <div style="margin-top:6px;font-size:12px">…or just click anywhere on the map.</div>`, true);
  $('go').onclick = searchPlace;
  $('place').addEventListener('keydown',e=>{ if(e.key==='Enter') searchPlace(); });
  map.off('click').on('click', e=>{ map.setView(e.latlng,15); setUser(e.latlng.lat,e.latlng.lng); loadNearby(e.latlng.lat,e.latlng.lng); });
}

async function searchPlace(){
  const q = $('place').value.trim(); if(!q) return;
  setStatus('<span class="spin"></span>Looking up place…');
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    if(!j.length){ setStatus('Place not found. Try another search.', true); return; }
    const lat=+j[0].lat, lng=+j[0].lon;
    map.setView([lat,lng],15); setUser(lat,lng); loadNearby(lat,lng);
  }catch(e){ setStatus('Place search failed: '+e.message, true); }
}

// ---- boot ----
fillTimeControls(); updateForTimePill();
$('refresh').onclick = ()=>{ if(lastPos) loadNearby(lastPos.lat,lastPos.lng); else locate(); };
['radius','hour','day'].forEach(id=>$(id).addEventListener('change',()=>{ updateForTimePill(); if(lastPos) loadNearby(lastPos.lat,lastPos.lng); }));
locate();
</script>
</body>
</html>
